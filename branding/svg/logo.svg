<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>

    <!-- ── Gradiente metálico principal — de oro brillante a oro oscuro ── -->
    <linearGradient id="goldMetal" x1="8%" y1="0%" x2="55%" y2="100%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#F4CC52"/>
      <stop offset="28%"  stop-color="#D9A830"/>
      <stop offset="62%"  stop-color="#C49020"/>
      <stop offset="100%" stop-color="#9B7010"/>
    </linearGradient>

    <!-- ── Gradiente chip — ligeramente más cálido ── -->
    <linearGradient id="goldChip" x1="5%" y1="0%" x2="70%" y2="100%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#F0C845"/>
      <stop offset="35%"  stop-color="#D4A02A"/>
      <stop offset="80%"  stop-color="#B88820"/>
      <stop offset="100%" stop-color="#926B10"/>
    </linearGradient>

    <!-- ── Overlay highlight — destello metálico superior ── -->
    <linearGradient id="metalSheen" x1="0%" y1="0%" x2="0%" y2="55%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- ── Sombra interior para profundidad del fondo ── -->
    <radialGradient id="bgDepth" cx="50%" cy="50%" r="72%">
      <stop offset="0%"   stop-color="#1e1a16"/>
      <stop offset="100%" stop-color="#0c0b0a"/>
    </radialGradient>

    <!-- ── Clippath redondeado — para contener todo ── -->
    <clipPath id="iconClip">
      <rect width="1024" height="1024" rx="220"/>
    </clipPath>

  </defs>

  <!-- ════ FONDO ════ -->
  <rect width="1024" height="1024" rx="220" fill="url(#bgDepth)"/>
  <!-- Borde dorado sutil — efecto premium -->
  <rect width="1024" height="1024" rx="220" fill="none"
        stroke="#d4a960" stroke-width="3" stroke-opacity="0.22"/>

  <!-- ════ LETRA F — path único, sin redondeos internos ════ -->
  <!-- M = moveto · H = horizontal · V = vertical · Z = close -->
  <path clip-path="url(#iconClip)"
        d="M162,143 H640 V240 H277 V460 H534 V551 H277 V871 H162 Z"
        fill="url(#goldMetal)"/>

  <!-- Destello metálico sobre la F -->
  <path clip-path="url(#iconClip)"
        d="M162,143 H640 V240 H277 V460 H534 V551 H277 V871 H162 Z"
        fill="url(#metalSheen)"/>

  <!-- ════ CHIP EMV — cuerpo sólido, inferior derecho ════ -->
  <rect x="655" y="695" width="205" height="176" rx="24"
        fill="url(#goldChip)"/>
  <!-- Destello metálico sobre el chip -->
  <rect x="655" y="695" width="205" height="176" rx="24"
        fill="url(#metalSheen)"/>

  <!-- ════ CHIP — celdas 2×3 (oscuras) ════ -->
  <!-- Fila 1 -->
  <rect x="673" y="709" width="80" height="44" rx="7" fill="#0d0c0b"/>
  <rect x="762" y="709" width="80" height="44" rx="7" fill="#0d0c0b"/>
  <!-- Fila 2 -->
  <rect x="673" y="761" width="80" height="44" rx="7" fill="#0d0c0b"/>
  <rect x="762" y="761" width="80" height="44" rx="7" fill="#0d0c0b"/>
  <!-- Fila 3 -->
  <rect x="673" y="813" width="80" height="44" rx="7" fill="#0d0c0b"/>
  <rect x="762" y="813" width="80" height="44" rx="7" fill="#0d0c0b"/>

</svg>
